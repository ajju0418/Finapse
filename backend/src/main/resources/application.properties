# =============================================================
# Finapse — Application Configuration
# =============================================================

spring.application.name=finapse

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finapse?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Ajjuvarsh@7}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Automatic Database Seed Initializer
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema_init.sql
spring.sql.init.data-locations=classpath:seed_init.sql
spring.sql.init.continue-on-error=true

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
