# =============================================================
# Finapse — Application Configuration
# =============================================================

spring.application.name=finapse

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finapse?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Ajjuvarsh@7}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Automatic Database Seed Initializer
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema_init.sql
spring.sql.init.data-locations=classpath:seed_init.sql
spring.sql.init.continue-on-error=true

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# =============================================================
# Authentication / JWT
# =============================================================
# IMPORTANT: override FINAPSE_JWT_SECRET in every non-local environment.
# Must be a Base64-encoded value of at least 32 bytes (256 bits).
finapse.auth.jwt-secret=${FINAPSE_JWT_SECRET:}
finapse.auth.issuer=finapse
# Access token lifetime (short-lived, kept in browser memory only)
finapse.auth.access-token-ttl=15m
# Refresh token lifetime (httpOnly cookie, rotated on every use)
finapse.auth.refresh-token-ttl=14d
finapse.auth.refresh-cookie-name=finapse_refresh
# Set to true when serving over HTTPS
finapse.auth.cookie-secure=${FINAPSE_COOKIE_SECURE:false}
finapse.auth.cookie-same-site=Lax
# Brute-force protection
finapse.auth.max-login-attempts=5
finapse.auth.login-lockout-duration=15m
# Allowed browser origins (comma separated).
# The extra localhost ports cover Next.js falling back when 3000 is taken.
# Production MUST override this with FINAPSE_ALLOWED_ORIGINS.
finapse.auth.allowed-origins=${FINAPSE_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}
